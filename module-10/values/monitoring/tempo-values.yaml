tempo:
  auth_enabled: false
  # Новый правильный формат хранения для Tempo 2.x
  repository_config:
    local:
      path: /var/tempo/traces
  
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

# Настройка диска (Volume Claim)
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi

# Включаем автоматический сборщик портов чарта
config:
  metrics_generator_enabled: false

