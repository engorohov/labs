# Передаем конфигурацию как многострочный текст (строку) для старого чарта
config: |
  multitenancy_enabled: false
  
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
  
  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

# Настройка диска остается обычным YAML на самом краю (без отступов)
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi

