multitenancyEnabled: false

config: |
  multitenancy_enabled: false

  server:
    http_listen_port: 3200 # ИСПРАВЛЕНО ЗДЕСЬ (было 3100)
    grpc_listen_port: 9095

  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi

