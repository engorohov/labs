apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-monitoring
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/engorohov/labs.git
    targetRevision: module-11
    path: manifests/podinfo-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
