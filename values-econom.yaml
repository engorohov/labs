defaultRules:
  create: true
  rules:
    node: true
    kubernetesApps: true
    kubelet: true
    kubernetesSystem: true
fullnameOverride: kps

# === ТОТАЛЬНАЯ ЭКОНОМИЯ РЕСУРСОВ КЛАСТЕРА ===

# Отключаем сбор метрик со служебных компонентов, которых на K3s все равно часто нет в дефолтном виде
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# === НАСТРОЙКИ ПРОМЕТЕУСА ===
prometheus:
  prometheusSpec:
    insecureSkipVerify: true
    scrapeInterval: 1m
    retention: 2h          # Храним метрики всего 2 часа, чтобы не забивать ОЗУ
    retentionSize: 300MB
    resources:
      requests:
        cpu: 50m           # Минимальный старт
        memory: 200Mi
      limits:
        cpu: 250m          # Жесткий потолок по процессору
        memory: 400Mi      # Безопасный потолок для 4ГБ ноды
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    additionalAlertManagers:
      - namespace: monitoring
        name: alertmanager-kps-alertmanager
        port: web

# === НАСТРОЙКИ АЛЕРТМЕНЕДЖЕРА (ТЕЛЕГРАМ) ===
alertmanager:
  alertmanagerSpec:
    secret:
      - alertmanager-telegram-secret
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'telegram'
      routes:
        - matchers:
            - alertname="Watchdog"
          receiver: 'null'
        - matchers:
            - severity="critical"
          receiver: 'telegram-critical'
          group_wait: 5s
          repeat_interval: 30m
    receivers:
      - name: 'null'
      - name: 'telegram'
        telegram_configs:
          - bot_token_file: '/etc/alertmanager/secrets/alertmanager-telegram-secret/BOT_TOKEN'
            chat_id_file: '/etc/alertmanager/secrets/alertmanager-telegram-secret/CHAT_ID'
            parse_mode: 'HTML'
            send_resolved: true
            message: |
              {{ range .Alerts }}
              <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
      - name: 'telegram-critical'
        telegram_configs:
          - bot_token_file: '/etc/alertmanager/secrets/alertmanager-telegram-secret/BOT_TOKEN'
            chat_id_file: '/etc/alertmanager/secrets/alertmanager-telegram-secret/CHAT_ID'
            parse_mode: 'HTML'
            send_resolved: true
            message: |
              🔥🔥🔥 CRITICAL 🔥🔥🔥
              {{ range .Alerts }}
              <b>{{ .Labels.alertname }}</b>
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

# === НАСТРОЙКИ ГРАФАНЫ ===
grafana:
  admin:
    existingSecret: "grafana-admin-secret"
    userKey: "admin-user"
    passwordKey: "admin-password"
  
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 11.2.0

  resources:
    requests:
      cpu: 350m
      memory: 256Mi
    limits:
      cpu: 450Mi
      memory: 512Mi

  livenessProbe:
    initialDelaySeconds: 120
    timeoutSeconds: 30
    periodSeconds: 20
    failureThreshold: 5

  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 30
    periodSeconds: 10
    failureThreshold: 5

